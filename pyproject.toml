[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-manager"
dynamic = ["version"]
description = "Audit project instructions and diagnose repeated coding-agent failures"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
context-manager = "context_manager.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_manager = ["prompts/*.md"]

[tool.setuptools.dynamic]
version = { attr = "context_manager.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "local_model: needs a local model runner and --local-model-config",
]
